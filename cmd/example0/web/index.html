<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeshNet</title>

<script src="https://unpkg.com/htmx.org@2.0.6"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
        font-family: system-ui, sans-serif;
        padding: 2rem 0;
    }

    main {
        width: min(700px, 90vw);
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 1.5rem;
    }

    h2 {
        font-size: 1rem;
        margin: 2rem 0 1rem;
        color: #444;
        border-top: 1px solid #eee;
        padding-top: 1.5rem;
    }

    textarea {
        width: 100%;
        min-height: 200px;
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        resize: vertical;
        font: inherit;
    }

    input[type="text"] {
        width: 100%;
        padding: 0.7rem 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
        margin-top: 1rem;
    }

    .controls {
        display: flex;
        gap: 1rem;
        margin-top: 1rem;
    }

    select,
    button {
        padding: 0.7rem 1rem;
        border-radius: 6px;
        border: 1px solid #ccc;
        font: inherit;
    }

    select {
        flex: 1;
        background: white;
    }

    button {
        background: #222;
        color: white;
        border-color: #222;
        cursor: pointer;
        white-space: nowrap;
    }

    button:hover {
        background: #444;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #status,
    #search-status {
        margin-top: 1rem;
        color: #666;
        min-height: 1.5rem;
    }

    #results {
        list-style: none;
        padding: 0;
        margin: 0.5rem 0 0;
    }

    #results li {
        padding: 0.5rem 0.75rem;
        border: 1px solid #eee;
        border-radius: 6px;
        margin-bottom: 0.5rem;
        font-family: monospace;
        font-size: 0.85rem;
        word-break: break-all;
    }
</style>

</head>
<body>
<main>
    <h1>MeshNet</h1>

    <form id="object-form">
        <textarea
            id="content"
            placeholder="Type something..."
            required
        ></textarea>

        <input
            type="text"
            id="tags"
            placeholder="Tags (comma separated, e.g. notes, draft)"
        >

        <div class="controls">
            <select id="transform">
                <option value="">No transform</option>
                <option value="uppercase@1">Uppercase</option>
                <option value="lowercase@1">Lowercase</option>
                <option value="encrypt@1">Encrypt</option>
            </select>

            <button
                type="submit"
                hx-indicator="#status"
            >
                Add
            </button>
        </div>
    </form>

    <div id="status"></div>

    <h2>Search by tag</h2>

    <form id="tag-search-form">
        <div class="controls">
            <input
                type="text"
                id="search-tag"
                placeholder="Enter a tag, e.g. notes"
                style="margin-top: 0;"
            >
            <button type="submit">Search</button>
        </div>
    </form>

    <div id="search-status"></div>
    <ul id="results"></ul>
</main>

<script>
    const form = document.getElementById("object-form");
    const content = document.getElementById("content");
    const tagsInput = document.getElementById("tags");
    const transform = document.getElementById("transform");
    const status = document.getElementById("status");

    const COLLECTION = "test";

    function generateName(text) {
        const slug = text
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 50);

        return (slug || "object") + ".txt";
    }

    function parseTags(value) {
        return value
            .split(",")
            .map((t) => t.trim())
            .filter((t) => t.length > 0);
    }

    async function addTag(objectID, tag) {
        const params = new URLSearchParams({
            object_id: objectID,
            tag: tag,
        });

        const response = await fetch(`/query/tags?${params.toString()}`, {
            method: "POST",
        });

        if (!response.ok) {
            const message = await response.text();
            throw new Error(`tag "${tag}": ${message}`);
        }
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const text = content.value;

        if (!text.trim()) {
            status.textContent = "Enter some text.";
            return;
        }

        const name = generateName(text);
        const tags = parseTags(tagsInput.value);

        const params = new URLSearchParams({
            collection: COLLECTION,
            name: name,
        });

        const selectedTransform = transform.value;

        if (selectedTransform) {
            params.set("transform", selectedTransform);
        }

        status.textContent = "Adding object...";

        try {
            const response = await fetch(`/objects?${params.toString()}`, {
                method: "PUT",
                headers: { "Content-Type": "text/plain" },
                body: text,
            });

            if (!response.ok) {
                const message = await response.text();
                throw new Error(message);
            }

            const result = await response.json();

            if (tags.length > 0) {
                status.textContent = `Created ${result.Object.Name}, tagging...`;
                await Promise.all(
                    tags.map((tag) => addTag(result.Object.ID, tag))
                );
            }

            status.textContent = `Created ${result.Object.Name} (${result.Object.Size} bytes)${
                tags.length ? ` — tagged: ${tags.join(", ")}` : ""
            }`;

            content.value = "";
            tagsInput.value = "";
            transform.value = "";
        } catch (error) {
            status.textContent = `Error: ${error.message}`;
        }
    });

    const tagSearchForm = document.getElementById("tag-search-form");
    const searchTagInput = document.getElementById("search-tag");
    const searchStatus = document.getElementById("search-status");
    const results = document.getElementById("results");

    tagSearchForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const tag = searchTagInput.value.trim();
        results.innerHTML = "";

        if (!tag) {
            searchStatus.textContent = "Enter a tag to search.";
            return;
        }

        const params = new URLSearchParams({
            tag: tag,
            collection: COLLECTION,
        });

        searchStatus.textContent = "Searching...";

        try {
            const response = await fetch(`/query/tags?${params.toString()}`);

            if (!response.ok) {
                const message = await response.text();
                throw new Error(message);
            }

            const result = await response.json();
            const ids = result.object_ids || [];

            if (ids.length === 0) {
                searchStatus.textContent = `No objects tagged "${tag}".`;
                return;
            }

            searchStatus.textContent = `${ids.length} object(s) tagged "${tag}":`;

            for (const id of ids) {
                const li = document.createElement("li");
                li.textContent = id;
                results.appendChild(li);
            }
        } catch (error) {
            searchStatus.textContent = `Error: ${error.message}`;
        }
    });
</script>
</body>
</html>
